<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#fff1e6"/><stop offset="1" stop-color="#f3b48c"/></radialGradient>
    <linearGradient id="body" x1="0" x2="1"><stop offset="0" stop-color="#1d1f26"/><stop offset=".5" stop-color="#3a3d48"/><stop offset="1" stop-color="#15171c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b6cff"/><stop offset=".5" stop-color="#7a4dff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="276" rx="80" ry="8" fill="#8a3f12" opacity=".22"/>
  <!-- the back, behind -->
  <rect x="214" y="34" width="104" height="226" rx="18" fill="url(#body)" transform="rotate(8 266 147)"/>
