    <circle cx="250" cy="66" r="10" fill="#22252e" stroke="#555a66" stroke-width="2"/>
    <circle cx="250" cy="90" r="10" fill="#22252e" stroke="#555a66" stroke-width="2"/>
    <circle cx="250" cy="111" r="4" fill="#ffd27a"/>
  </g>
  <!-- the front -->
