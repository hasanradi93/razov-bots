  <text x="160" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#fff" opacity=".85">Friday 16 October</text>
  <rect x="122" y="214" width="15" height="15" rx="5" fill="#fff" opacity=".35"/>
  <rect x="143" y="214" width="15" height="15" rx="5" fill="#fff" opacity=".35"/>
  <rect x="164" y="214" width="15" height="15" rx="5" fill="#fff" opacity=".35"/>
  <rect x="185" y="214" width="15" height="15" rx="5" fill="#fff" opacity=".35"/>
  <rect x="120" y="40" width="10" height="210" rx="5" fill="url(#shine)" opacity=".5"/>
